spring.application.name=bookvault

# Hosting conf
server.port=${PORT:8089}

# H2 Database Config
spring.datasource.url=jdbc:h2:mem:bookvault_db
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=false

# Cleanup the console
spring.main.banner-mode=off
#logging.level.root=warn # Keeping this off for diagnostics

# App customization
app.site.name=BookVault
app.favicon.path=/favicon.ico?v=001
app.favicon.type=image/x-icon
