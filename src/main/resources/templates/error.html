<!DOCTYPE html>
<html lang="en">
<head th:replace="~{fragments/head :: head}"></head>
<body>

<div class="container-fluid min-vh-100 justify-content-center align-items-center d-flex">
    <div class="card text-center shadow">
        <div class="card-header p-4">
            <h1 class="card-title">Something went wrong!</h1>
        </div>
        <div class="card-body p-4">
            <h2 class="card-text" th:text="${'Error Code: '+ statusCode}"></h2>
        </div>
        <div class="card-footer p-4 d-flex justify-content-between">
            <button class="btn btn-outline-secondary" onclick="history.back()">Go Back</button>
            <a class="btn btn-primary" th:href="@{/home}">Return Home</a>
        </div>
    </div>
</div>

</body>
