<!doctype html>
<html lang="en">

<head th:replace="~{fragments/head :: head}"></head>

<body>

<nav th:replace="~{fragments/navbar :: navbar}"></nav>

<div class="container">
    <h1 th:text="${'Add a new Edition to ' + work.displayTitle}"></h1>

    <form th:action="@{/works/{workId}/editions/add(workId=${work.id})}" th:object="${edition}" method="POST">

        <label for="title">Title:</label>
        <input type="text" th:field="*{title}" id="title">

        <label for="subtitle">Subtitle:</label>
        <input type="text" th:field="*{subtitle}" id="subtitle">

        <label for="publishdate">Date published</label>
        <input type="date" th:field="*{publishedDate}" id="publishdate">

        <input type="submit" value="Add Edition">

    </form>


</div>

</body>
</html>
