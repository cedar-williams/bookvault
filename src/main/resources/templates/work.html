<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${pageTitle + ' - ' + siteName}"></title>
    <link rel="icon" th:type="${faviconType}" th:href="@{${faviconPath}}">
    <link rel="stylesheet" href="/style.css">
</head>
<body>

<div id="work">
    <h1 th:text="${work.displayTitle}">Book Title</h1>
    <hr>
    <h2>Editions</h2>
    <div class="edition" th:each="edition : ${work.editions}">
        <h3 th:text="${edition.displayTitle}">Edition Title</h3>
        <h4 th:text="${'Published: ' + edition.publishedDate}"></h4>
        <h4>Publisher:</h4>
        <div th:each="publisher: ${edition.publishers}">
            <p th:text="${publisher.name}">Publisher Name</p>
        </div>


        <div class="authors">
            <h4>Authors</h4>
            <div th:each="author: ${edition.authors}">
                <p th:text="${author.name}">Author Name</p>
            </div>
        </div>
    </div>



</div>

<footer>
    <a th:href="@{/home}">Return Home</a>
</footer>

</body>
</html>
